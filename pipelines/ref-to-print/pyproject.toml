[project]
name = "ref-to-print"
version = "0.0.1"
description = "Reference images to printable parts: contracts, checks and the r2p driver"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "trimesh",
    "manifold3d",
    "rtree",
    "jsonschema",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
